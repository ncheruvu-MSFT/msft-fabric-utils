# ============================================================
# fabric-cicd "variable library" — parameter.yml
#
# MUST live at the ROOT of repository_directory (this folder, fabric-items/),
# otherwise fabric-cicd never reads it. Docs:
#   https://microsoft.github.io/fabric-cicd/latest/how_to/parameterization/
#
# Environment keys (dev/test/prod) are matched to the `--environment` value
# passed by the pipeline (fabric_deploy.py --environment <env>).
# `find_value` is the DEV value that literally appears in the source files;
# fabric-cicd replaces it with the per-environment `replace_value`.
# ============================================================

find_replace:
  # ── Lakehouse GUID (lh_silver) referenced in the notebook's default_lakehouse ──
  # Swap the DEV lakehouse id for the TEST/PROD lakehouse id.
  - find_value: "11111111-1111-1111-1111-111111111111"     # DEV lh_silver id
    replace_value:
      dev:  "11111111-1111-1111-1111-111111111111"         # DEV (no-op)
      test: "22222222-2222-2222-2222-222222222222"         # TEST lh_silver id
      prod: "33333333-3333-3333-3333-333333333333"         # PROD lh_silver id
    item_type: "Notebook"
    file_path: "**/notebook-content.py"

  # ── Lakehouse workspace id ──
  # Dynamic variable: resolve to the TARGET workspace id at deploy time,
  # so notebooks always point at the workspace they land in.
  - find_value: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"      # DEV workspace id
    replace_value:
      _ALL_: "$workspace.$id"                               # target workspace id (any env)
    item_type: "Notebook"
    file_path: "**/notebook-content.py"
