id: data-agent-governance-app
name: Data Agent Governance App
version: 0.1.0
deployment:
  workspaceId: ${FABRIC_WORKSPACE_ID}
  capacityId: ${FABRIC_CAPACITY_ID}
services:
  data:
    enabled: true
    dialect: mssql
  auth:
    enabled: true
    expiryInMinutes: 60
    refreshToken:
      lifetimeInDays: 30
    scopes:
      - read:data
      - write:data
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5173/auth/callback
      - https://gust-dew-865abb4382-westus2.webapp.fabricapps.net
    password:
      enabled: false
    fabric:
      enabled: true
  staticHosting:
    enabled: true
    root: .
    folder: dist
    buildCommand: npm run build
    indexDocument: index.html
  storage:
    enabled: false
  functions:
    enabled: false
